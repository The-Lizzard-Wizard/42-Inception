services:

  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    image: mariadb
    pull_policy: build
    restart: always
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception_network
    expose:
      - "3306"

  networks:
    inception_network:
      drivers: bridge
  
  volumes:
    mariadb_data:
      driver: local
      driver_opts:
        type: none
        o: bind
        device: /home/${USER}/data/mariadb